name: Diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Diag all steps
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -x
          echo "STEP1 xray download"
          curl -sL https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip -o /tmp/xray.zip && echo "xray zip size: $(stat -c%s /tmp/xray.zip)"
          unzip -oq /tmp/xray.zip -d /tmp/vless-bin && chmod +x /tmp/vless-bin/xray && /tmp/vless-bin/xray version | head -1
          echo "STEP2 cloudflared"
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared && chmod +x /tmp/cloudflared && /tmp/cloudflared --version | head -1
          echo "STEP3 gh auth"
          echo "$GH_PAT" | gh auth login --with-token && gh auth status | head -5
          echo "STEP4 gist edit"
          echo test > /tmp/g.txt && gh gist edit d6a7b65c88272b04a184afcf49f276ca /tmp/g.txt && echo GIST_OK
          echo "STEP5 start xray"
          cat > /tmp/s.json <<'JSON'
          {"log":{"loglevel":"warning"},"inbounds":[{"tag":"in","listen":"127.0.0.1","port":4443,"protocol":"vless","settings":{"clients":[{"id":"7a5dfe59-ea03-480d-a736-91db8ac2bb37","level":0}],"decryption":"none"},"streamSettings":{"network":"ws","wsSettings":{"path":"/vless"}}}],"outbounds":[{"protocol":"freedom"}]}
          JSON
          /tmp/vless-bin/xray run -c /tmp/s.json >/tmp/x.log 2>&1 & sleep 2; cat /tmp/x.log | head -3
          echo "STEP6 tunnel"
          /tmp/cloudflared tunnel --no-autoupdate --protocol http2 --url http://127.0.0.1:4443 >/tmp/cf.log 2>&1 & sleep 15
          grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1
          tail -5 /tmp/cf.log
          echo "STEP7 selftest"
          URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
          curl -sS --max-time 10 -o /dev/null -w 'origin=%{http_code}\n' "$URL/vless"
          echo DONE
