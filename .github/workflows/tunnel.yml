name: VLESS Auto Tunnel
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: vless-tunnel
  cancel-in-progress: true

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      - name: Install Xray + cloudflared
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -sL https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip -o /tmp/xray.zip
          unzip -oq /tmp/xray.zip -d /tmp/vless-bin
          chmod +x /tmp/vless-bin/xray
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          mkdir -p /tmp/vless
          UUID="7a5dfe59-ea03-480d-a736-91db8ac2bb37"
          cat > /tmp/vless/server.json <<JSON
          {"log":{"loglevel":"warning"},"inbounds":[{"tag":"vless-in","listen":"127.0.0.1","port":4443,"protocol":"vless","settings":{"clients":[{"id":"$UUID","level":0}],"decryption":"none"},"streamSettings":{"network":"ws","wsSettings":{"path":"/vless"}},"sniffing":{"enabled":true,"destOverride":["http","tls"]}}],"outbounds":[{"tag":"direct","protocol":"freedom"}]}
          JSON
          /tmp/vless-bin/xray run -c /tmp/vless/server.json >/tmp/vless/xray.log 2>&1 &
          sleep 2
          /tmp/cloudflared tunnel --no-autoupdate --protocol http2 --url http://127.0.0.1:4443 >/tmp/vless/cf.log 2>&1 &
          echo "=== waiting for tunnel URL ==="
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/vless/cf.log | head -1)
            if [ -n "$URL" ]; then echo "TUNNEL_URL=$URL"; break; fi
            sleep 2
          done
          echo "=== VLESS URI ==="
          HOST=$(echo "$URL" | sed 's|https://||')
          echo "vless://$UUID@$HOST:443?security=tls&type=ws&path=%2Fvless&host=$HOST&sni=$HOST&fp=chrome#%F0%9F%87%AB%F0%9F%87%B7%20AUTO"
          echo "=== self-test through Xray client ==="
          sleep 5
          curl -sS --max-time 10 -o /dev/null -w 'origin_code=%{http_code}\n' "$URL/vless" || true
          echo "=== publish to gist ==="
          echo "$GH_PAT" | gh auth login --with-token
          echo "GH_AUTH_STATUS:"; gh auth status | head -3
          cat > /tmp/gist-content.txt <<CONTENT
          TUNNEL_URL: $URL
          VLESS_URI: vless://$UUID@$HOST:443?security=tls&type=ws&path=%2Fvless&host=$HOST&sni=$HOST&fp=chrome#%F0%9F%87%AB%F0%9F%87%B7%20AUTO
          UPDATED: $(date -u)
          CONTENT
          gh gist edit d6a7b65c88272b04a184afcf49f276ca /tmp/gist-content.txt 2>&1 || true
          echo "=== keeping alive ==="
          while true; do sleep 60; done
